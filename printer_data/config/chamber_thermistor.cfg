#####################################################################
#   Chamber thermistor — NOT INSTALLED YET
#####################################################################
## Uncomment when the sensor is physically wired. The name must stay exactly
## "chamber" — PRINT_START asks for the sensor by the full section name
## "temperature_sensor chamber", so [temperature_sensor chamber_temp] will NOT
## match and you'll get the "Unknown sensor" error that was cancelling prints.
##
## Pin: your board is an SKR Pico (RP2040). Only gpio26-29 can read analog, and
## gpio26 (THB/bed) and gpio27 (TH0/hotend) are already taken — so gpio28 is the
## one to use. Check your board's pinout for where it's broken out before wiring.
##
## sensor_type: match the thermistor you actually buy. "Generic 3950" covers the
## common 100k NTC beads sold for chamber use.

#[temperature_sensor chamber]
#sensor_type: Generic 3950
#sensor_pin: gpio28
#min_temp: 0
#max_temp: 100
#gcode_id: C
