## Nevermore filter — corrected
##
## Changes from the original:
##  - [menu] blocks referenced 'fan_generic Nevermore', but the section below is
##    'output_pin Nevermore'. The enable: guards were therefore always False and
##    the menu entries never appeared on the 12864 display. Fixed to output_pin.
##  - Added explicit NEVERMORE_ON / NEVERMORE_OFF macros. Use these in print
##    macros. TOGGLE_NEVERMORE is state-dependent and must never be used for
##    automation — it is kept only for the physical display button.

[output_pin Nevermore]
pin: gpio20
pwm: true
cycle_time: 0.010
value: 0
shutdown_value: 0

#####################################################################
#   Explicit control — use these in PRINT_START / PRINT_END
#####################################################################

[gcode_macro NEVERMORE_ON]
description: Turn the Nevermore filter on (idempotent)
gcode:
    {% set s = params.SPEED|default(1.0)|float %}
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=0    # cancel any pending shutoff
    SET_PIN PIN=Nevermore VALUE={s}

[gcode_macro NEVERMORE_OFF]
description: Turn the Nevermore filter off immediately (idempotent)
gcode:
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=0    # cancel any pending shutoff
    SET_PIN PIN=Nevermore VALUE=0

[delayed_gcode filter_off]
gcode:
    SET_PIN PIN=Nevermore VALUE=0

#####################################################################
#   Toggle — for the physical control knob only, NOT for macros
#####################################################################

[gcode_macro TOGGLE_NEVERMORE]
description: Flip the Nevermore between on and off
gcode:
    {% if printer['output_pin Nevermore'].value > 0 %}
      NEVERMORE_OFF
    {% else %}
      NEVERMORE_ON
    {% endif %}

#####################################################################
#   12864 display menu entries
#####################################################################

[menu __main __control __nevermoreonoff]
type: command
name: Nevermore {'ON' if printer['output_pin Nevermore'].value > 0 else 'OFF'}
enable: {'output_pin Nevermore' in printer}
gcode:
    TOGGLE_NEVERMORE

[menu __main __control __filterspeed]
type: input
enable: {'output_pin Nevermore' in printer}
name: Filter %: {'%3d' % (menu.input*100)}%
input: {printer['output_pin Nevermore'].value}
input_min: 0
input_max: 1
input_step: 0.1
gcode:
    SET_PIN PIN=Nevermore VALUE={menu.input}

